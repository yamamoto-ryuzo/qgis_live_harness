<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>WebEngine Plugin</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: "Segoe UI", Meiryo, sans-serif; margin: 0; padding: 16px; }
  header { display: flex; align-items: baseline; gap: 12px; }
  #qgis-version { font-size: 12px; opacity: .7; }
  section { margin-top: 16px; }
  button { padding: 6px 14px; }
  #layer-list { list-style: none; padding: 0; }
  #layer-list li { padding: 6px 8px; border-bottom: 1px solid #8883; cursor: pointer; }
  #layer-list li:hover { background: #8882; }
  #layer-list li.active { outline: 2px solid #4c9ffe; }
  #status { margin-top: 12px; font-size: 13px; min-height: 1.2em; }
  #status.error { color: #e5534b; }
</style>
</head>
<body>
<header>
  <h2>WebEngine Plugin</h2>
  <span id="qgis-version" data-testid="qgis-version"></span>
</header>

<section>
  <button id="btn-refresh" data-testid="btn-refresh">レイヤー一覧を更新</button>
  <button id="btn-zoom" data-testid="btn-zoom">アクティブレイヤーへズーム</button>
  <ul id="layer-list" data-testid="layer-list"></ul>
</section>

<div id="status" data-testid="status"></div>

<!-- QGIS内(QWebEngine)でのみ解決できる。qrcスキームは通常ブラウザでは失敗するだけ -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="src/mock-bridge.js"></script>
<script src="src/bridge-client.js"></script>
<script src="src/main.js"></script>
</body>
</html>
